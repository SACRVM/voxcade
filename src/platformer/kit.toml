# The platformer kit: kinds of things at the scale of Sunny Land's
# pictures (a tile 16 voxels; the fox 20 tall, the opossum 16, the frog 18,
# the eagle 24), a starting point to copy into a game's conf.lua (as
# c.things.NAME = { ... }), nothing more: a game has exactly the things it
# defines. The numbers here are the behaviours' defaults: a kind sets only
# the ones it changes, and the lengths and speeds it leaves unset follow
# its height (half as tall, half as fast and high; voxcade kinds GAME
# prints what is in effect). They say how things move;
# what a touch means (a stomp, a pickup, a door, spikes, a life lost) is
# the game's code (main.lua: on_touch, on_tick, on_death, on_fall_out).
#
# Every kind may set, besides its behaviour's numbers:
#   width  = 12             # its body across and deep (the physics' without;
#                           # at most as deep as the lane, a block's depth)
#   height = 20             # its body's height (its model's without)
#   facing = { 0, -1 }      # the way it faces as it comes in (x across, y into
#                           # the level: { 0, -1 } the camera); unset, a figure
#                           # towards the level's middle
#   frames = { run = { 4, 9 } }   # its model's frames for what it does, first to last,
#                           # round and round; a set may say its own speed,
#                           # go by the way walked (stride = 6: a frame every
#                           # 6 voxels) and play once, its last frame held (a
#                           # jump, a pull):
#                           # idle = { first = 0, last = 1, fps = 2 },
#                           # pull = { first = 9, last = 11, loop = false }
#   fps    = 10             # how fast its frames go where a set does not say
#   effect = "poof.vox"     # shown once where one of its things goes
#                           # ({ model = "poof.vox", fps = 20 }: its speed, 12
#                           # without); "burst": it bursts into its voxels,
#                           # which fall and are gone
#   spin   = 120            # its model turns round, degrees a second (a gem)
#   swing  = { leg_left = 30, leg_right = -30 }   # a model of parts (its objects
#                           # named in the file): parts swinging as it walks,
#                           # degrees forward first (below 0: back first)
#   sound  = "stomp"        # heard where one of its things goes
#   props  = { worth = 100 }  # what the game's code reads (thing.props)
#   family = "enemies"      # a family, or a list of them
# The frames' names are what the behaviour plays: the hero idle, run,
# jump, fall, crouch, hurt, climb, hang, pull; a walker walk; a hopper
# idle, jump; a flyer fly; a pickup spin; a prop the pose the game sets
# (thing.state.pose, idle at first); a platform idle.

[things.hero]
behaviour = "hero"
speed = 150             # running, voxels a second
accel = 1200            # how quickly it gets there on the ground
air_accel = 800         # and in the air
jump = 29               # how high a jump goes, voxels
jump_cut = 0.5          # what is left of the rise when the jump is let go
coyote = 6              # ticks off a ledge a jump still goes
buffer = 6              # ticks a jump pressed early waits for the ground
climb = 60              # up and down ladders, voxels a second (without left or right it moves to the ladder's middle; a ladder's top it stands on, down climbs down)
invulnerable = 60       # ticks after a hit nothing hurts ...
blink = 4               # ... and it blinks, this many ticks shown, as many not (0: steady)
knockback = [100, 100]  # a hit throws it back and up, voxels a second
fall_gravity = 1.5      # gravity times this on the way down: snappy, not floaty (1: as up)
hang = 0.5              # gravity times this at the top of a jump while jump is held ...
hang_speed = 30         # ... "the top": rising or falling slower than this, voxels a second
corner = 4              # a head clipping a ceiling's edge by up to this many voxels slips past
look_ahead = 40         # the view leads this far where it runs, voxels (0: centred) ...
look_ahead_speed = 90   # ... swinging round at this speed, voxels a second
grab = 0                # how far above its head its hands catch a ledge's edge, voxels (0: none) ...
grab_ahead = 3          # ... how far ahead of its body it finds it, voxels ...
hang_below = 2          # ... how far under it its head hangs, voxels (an edge lower it pulls itself onto at once) ...
pull = 24               # ... and the ticks pulling itself up (up or jump; down lets go)
face_ladder = true      # climbing, it turns to the ladder: its back to the camera
air_jumps = 0           # jumps it may make again in the air before landing (1: a double jump) ...
air_jump = 20           # ... each this high from where it is then, voxels

[things.walker]
behaviour = "walker"
speed = 60              # voxels a second
ledges = true           # turns at a ledge as at a wall

[things.hopper]
behaviour = "hopper"
every = 120             # ticks between hops, left and right in turn
hop = [100, 200]        # how far and high: voxels a second across and up

[things.flyer]
behaviour = "flyer"
range = 50              # up and down from where it is placed, voxels
period = 120            # ticks for once up and down
face_hero = true        # it turns to the hero; false: it keeps the way it was placed

[things.pickup]
behaviour = "pickup"    # it spins; what it gives is the game's code

[things.platform]
behaviour = "platform"  # to and fro; the game's code may send it to one end to stay:
                        # thing.state.goal = "end" or "start" (out of a wall, a trapdoor, a lift), nil: to and fro
travel = [64, 0]        # how far it goes from where it is placed, across and up
speed = 30              # voxels a second
pause = 30              # ticks it waits at each end
crushes = false         # coming down onto the hero: true hurts it (a trap), false waits above it

[things.prop]
behaviour = "prop"
stands = false          # true: it stands on the floor below where it is placed (a door, spikes)

[things.crate]
behaviour = "crate"     # the hero pushes it by walking into it: it falls over edges, is stood on,
                        # walkers turn at it, it holds down what it lies on (a plate: your code)
push = 30               # pushed this fast at most, voxels a second
