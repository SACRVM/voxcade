size = [100, 40, 16]    # cells: across (x), deep (y, 0 in front), up (z)
view = "above"        # each layer the grid seen from above, the bottom layer first, its far row first

[blocks]              # blocks/NAME.vvx, each what it is to the game
floor = "solid"
tile_a = "solid"
tile_b = "solid"
wall = "solid"
pillar = "solid"
side = "solid"
stage = "solid"

[legend]              # a sign is a block as it lies: its name, or the name and an orientation (0 to 47)
f = "floor"
s = "side"
S = "stage"
t = "tile_b"
T = "tile_a"
w = "wall"
p = "pillar"

