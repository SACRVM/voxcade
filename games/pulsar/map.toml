format = "voxcade map 1"
size = [480, 8000, 64]    # voxels: across (x), north (y), up (z)

# The ground: each column as high as the height map's grey (its top row
# the north edge), of the material whose key the material map's colour is.
[ground]
height = "ground/height.png"

[[ground.materials]]
surface = ["#f4f6ff", "#c6d8ff", "#fff0c8", "#9cb8ff", "#ffffff"]

# The prefabs by name: each its file; a soft one (grass) is passed through.
[prefabs]
launch_pad = "prefabs/launch_pad.vvx"
rock_0 = "prefabs/rock_0.vvx"
rock_1 = "prefabs/rock_1.vvx"
rock_2 = "prefabs/rock_2.vvx"
rock_3 = "prefabs/rock_3.vvx"
rock_4 = "prefabs/rock_4.vvx"
rock_5 = "prefabs/rock_5.vvx"
rock_6 = "prefabs/rock_6.vvx"
rock_7 = "prefabs/rock_7.vvx"
station = "prefabs/station.vvx"

# What stands on the map, in order: a prefab (turn: quarter turns
# anticlockwise) or a thing of a kind; at x, y on the ground, or x, y, z.
