format = "voxcade map 1"
size = [640, 2368, 80]    # voxels: across (x), north (y), up (z)

# The ground: each column as high as the height map's grey (its top row
# the north edge), of the material whose key the material map's colour is.
[ground]
height = "ground/height.png"
material = "ground/material.png"
bedrock = "#624a34"

[[ground.materials]]
key = "#e0c080"
surface = ["#d6b880", "#dec189", "#cdaf78", "#e6cb94", "#c4a570"]
depth = 3
pattern = 14
grain = 0.45
strata = ["#78583a", "#967048"]
band = 2

[[ground.materials]]
key = "#8c5a3c"
surface = ["#845e42", "#966c4e", "#a87c58", "#b68c64"]
pattern = 5
grain = 0.3
strata = ["#966c4e", "#845e42", "#a87c58", "#73523a"]
wobble = 3

[[ground.materials]]
key = "#c8a070"
surface = ["#d6b880", "#dec189", "#cdaf78", "#e6cb94", "#c4a570"]
pattern = 14
grain = 0.45
strata = ["#966c4e", "#845e42", "#a87c58", "#73523a"]
wobble = 3

