# Jungle Pulse (made with Suno, turned into MIDI): which tracks become which
# voice. Run `python3 tools/midi2mml.py games/moreblood/music/jungle_pulse.import.toml`
# to write jungle_pulse.mml, then tweak either file.

title = "Jungle Pulse"
out = "jungle_pulse.mml"

[instruments]
lead    = "square duty=0.25 pwm=0.1 pwm_speed=0.6 attack=0.01 decay=0.25 sustain=0.6 release=0.15 vibrato=0.012 vibrato_speed=5.5 vibrato_delay=0.15 volume=0.34"
stab    = "square duty=0.5 attack=0.003 decay=0.12 sustain=0.35 release=0.06 lowpass=3200 volume=0.24"
pulse   = "square duty=0.125 attack=0.002 decay=0.07 sustain=0.25 release=0.03 lowpass=1800 volume=0.3"
bass    = "triangle attack=0.002 decay=0.2 sustain=0.8 release=0.05 volume=0.8"
brass   = "saw attack=0.02 decay=0.2 sustain=0.6 release=0.12 lowpass=1700 vibrato=0.008 vibrato_delay=0.2 volume=0.26"
kick    = "triangle freq=120 sweep=-30 sweep_time=0.09 attack=0.001 decay=0.12 sustain=0 release=0.01 volume=0.9"
snare   = "noise freq=5500 attack=0.001 decay=0.13 sustain=0 release=0.02 volume=0.45"
tom     = "triangle freq=170 sweep=-12 sweep_time=0.15 attack=0.001 decay=0.16 sustain=0 release=0.02 volume=0.7"
rim     = "noise freq=9000 attack=0.001 decay=0.02 sustain=0 release=0.005 volume=0.32"
hat     = "noise freq=14000 attack=0.001 decay=0.03 sustain=0 release=0.01 volume=0.16"
openhat = "noise freq=13000 attack=0.001 decay=0.16 sustain=0 release=0.02 volume=0.16"
crash   = "noise freq=11000 attack=0.001 decay=0.9 sustain=0 release=0.1 lowpass=9000 volume=0.26"

# The synth choir: the melody.
[[part]]
channel = "A"
file = "jungle_pulse/vocals.mid"
midi_channels = [1, 3]
pick = "high"
instrument = "lead"
volume = 13

# Riff and chord stabs on top of the synth track.
[[part]]
channel = "S"
file = "jungle_pulse/synth.mid"
midi_channels = [0]
pitch = [64, 127]
pick = "high"
instrument = "stab"
volume = 11
pan = -25

# The pulse underneath it: the 16ths on G3 and D4.
[[part]]
channel = "P"
file = "jungle_pulse/synth.mid"
midi_channels = [0]
pitch = [55, 63]
pick = "low"
instrument = "pulse"
volume = 11
pan = 25

# Round, an octave up from the transcription; single-16th holes from the
# audio closed, the rests in the break kept.
[[part]]
channel = "B"
file = "jungle_pulse/bass.mid"
midi_channels = [1]
pick = "low"
instrument = "bass"
octave = 1
fill_gaps = 1
volume = 13

# The brass answer in the second half.
[[part]]
channel = "E"
file = "jungle_pulse/brass.mid"
midi_channels = [1, 4]
pick = "high"
instrument = "brass"
volume = 11
pan = 35

[[part]]
channel = "D"
file = "jungle_pulse/drums.mid"
midi_channels = [9]
pick = "drums"
drums = { 36 = "kick", 35 = "kick", 38 = "snare", 40 = "snare", 43 = "tom", 45 = "tom", 47 = "tom", 50 = "tom" }
volume = 13

[[part]]
channel = "H"
file = "jungle_pulse/drums.mid"
midi_channels = [9]
pick = "drums"
drums = { 49 = "crash", 57 = "crash", 46 = "openhat", 42 = "hat", 44 = "hat" }
volume = 13
pan = 15

[[part]]
channel = "K"
file = "jungle_pulse/percussion.mid"
midi_channels = [9]
pick = "drums"
drums = { 37 = "rim" }
volume = 12
pan = -15
